name: DanceCoverUni Automation Pipeline

on:
  schedule:
    # Runs daily at 04:00 UTC (11:00 AM UTC+7 / Vietnam Time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (Simulate without actual YouTube upload)'
        required: false
        type: boolean
        default: false
      max_candidates:
        description: 'Maximum approved videos to process (up to 6)'
        required: false
        type: number
        default: 6

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest --upgrade yt-dlp

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DOUYIN_COOKIES: ${{ secrets.DOUYIN_COOKIES }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ inputs.max_candidates }}" ]; then
            ARGS="$ARGS --max-candidates ${{ inputs.max_candidates }}"
          fi
          python -m src.main $ARGS

      - name: Commit and Push History Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update processed video history [skip ci]"
          file_pattern: "data/history.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
